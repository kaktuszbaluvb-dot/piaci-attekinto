name: Adatfrissítés és közzététel

on:
  schedule:
    # Amerikai zárás (16:00 ET) után. 23:30 UTC télen 18:30, nyáron 19:30 New York-i idő.
    - cron: "30 23 * * 1-5"
    # Európai reggel, hogy a hírek és az európai adat napközben friss legyen.
    # 05:30 UTC télen 06:30, nyáron 07:30 Budapest.
    - cron: "30 5 * * 1-5"
  workflow_dispatch:
  # A kézi napi összefoglaló commitja újra közzéteszi az oldalt.
  # A GITHUB_TOKEN-es adatcommit nem indít új futást, és a paths szűrő
  # sem engedi, ha a commit nem ezt a fájlt érinti.
  push:
    branches:
      - main
    paths:
      - web/data/news_summary.json

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: piaci-attekinto
  cancel-in-progress: false

jobs:
  frissites:
    # A saját adatcommit (github-actions[bot]) ne indítson új kört.
    if: github.event_name != 'push' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Forráskód
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Függőségek
        run: pip install -r requirements.txt

      - name: Adatok lekérése
        run: python scripts/fetch_data.py

      - name: Adatok mentése a repóba
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "${{ github.ref_name }}"
          stashed=0
          if git stash push --include-untracked -m "adatfrissites" -- cache web/data/dashboard.json; then
            stashed=1
          fi
          git rebase "origin/${{ github.ref_name }}"
          if [ "$stashed" = 1 ]; then
            git stash pop
          fi
          git add cache web/data/dashboard.json
          git restore --staged web/data/news_summary.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "Nincs változás az adatokban."
          else
            git commit -m "Adatok frissítése"
            git push origin "HEAD:${{ github.ref_name }}"
          fi

      - name: Gyorsítótár-törés
        run: |
          VERSION="${GITHUB_SHA:0:7}"
          if [ -z "$VERSION" ]; then
            VERSION="$(date -u +%Y%m%d%H%M%S)"
          fi
          export VERSION
          python3 scripts/stamp_assets.py

      - name: Oldal csomagolása
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

  kozzetetel:
    needs: frissites
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Közzététel GitHub Pagesre
        id: deployment
        uses: actions/deploy-pages@v4
